appId: com.monolithworks.webclone
productName: WebClone Studio
copyright: "Copyright © 2026 Monolith Works / MonarchDevLab"
directories:
  output: dist
  buildResources: resources
compression: maximum
electronLanguages:
  - tr
  - en-US
  - en
files:
  - "out/**/*"
  - "!**/.env*"
  - "!**/*.pem"
  - "!**/*.key"
  - "!**/*.md"
asarUnpack:
  - "**/node_modules/source-map/lib/mappings.wasm"
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: resources/icon.ico
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64]
portable:
  artifactName: "WebClone-Studio-Portable.exe"
  requestExecutionLevel: user
  unpackDirName: "WebCloneStudio"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "WebClone Studio"
  artifactName: "WebClone-Studio-Setup-${version}.exe"
msi:
  artifactName: "WebClone-Studio-${version}.msi"
  oneClick: false
  perMachine: false
npmRebuild: false
