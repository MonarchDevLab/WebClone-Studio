appId: com.monolithworks.webclone
productName: WebClone Studio
copyright: "Copyright © 2026 Monolith Works / MonarchDevLab"
directories:
  output: dist
  buildResources: resources
compression: maximum
electronLanguages:
  - tr
  - en-US
  - en
files:
  - "out/**/*"
  - "!**/.env*"
  - "!**/*.pem"
  - "!**/*.key"
  - "!**/*.md"
win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
  icon: resources/icon.ico
portable:
  artifactName: "WebClone-Studio-Portable.exe"
  requestExecutionLevel: user
  unpackDirName: "WebCloneStudio"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "WebClone Studio"
  artifactName: "WebClone-Studio-Setup-${version}.exe"
msi:
  artifactName: "WebClone-Studio-${version}.msi"
  oneClick: false
  perMachine: false
npmRebuild: false
